<div class="page">
  <app-page-header
    [breadcrumb]="'User View / Users'"
    [title]="'Offers'"
    [subtitle]="'Offers for ' + userLabel()"
    [actions]="headerActions"
  />

  <!-- Tab Navigation -->
  <div class="user-tabs">
    <a class="user-tab" [routerLink]="['/dashboard/users', userId(), 'overview']" routerLinkActive="active">Dashboard</a>
    <a class="user-tab" [routerLink]="['/dashboard/users', userId(), 'orders']" routerLinkActive="active">Orders</a>
    <a class="user-tab" [routerLink]="['/dashboard/users', userId(), 'addresses']" routerLinkActive="active">Addresses</a>
    <a class="user-tab" [routerLink]="['/dashboard/users', userId(), 'offers']" routerLinkActive="active">Offers</a>
    <a class="user-tab" [routerLink]="['/dashboard/users', userId(), 'ratings']" routerLinkActive="active">Ratings</a>
    <a class="user-tab" [routerLink]="['/dashboard/users', userId(), 'activity']" routerLinkActive="active">Activity</a>
  </div>

  <div class="page-content">
    @if (loading()) {
      <app-skeleton-list [rows]="4" />
    } @else if (offers().length === 0) {
      <app-empty-state
        title="No offers yet"
        message="This user has no offers assigned. Use “Create Offer” to add one just for them."
      />
    } @else {
      <div class="offers-list">
        @for (offer of offers(); track offer.offerId) {
          <app-rich-list-item
            [id]="offer.offerId"
            [name]="offer.offerName"
            [description]="offer.offerCode"
            [category]="discountLabel(offer)"
            [status]="status(offer)"
            [stats]="offerStats(offer)"
            [showEdit]="true"
            [showDelete]="true"
            [accentBar]="true"
            (editClick)="openEdit(offer)"
            (deleteClick)="confirmDelete(offer)"
          />
        }
      </div>
    }
  </div>
</div>
