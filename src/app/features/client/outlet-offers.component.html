<div class="offers-section">
  <div class="offers-header">
    <div>
      <div class="offers-title">Offers</div>
      <div class="offers-sub">Offers usable at this outlet</div>
    </div>
    <button type="button" class="offer-add-btn" (click)="createOffer()">
      <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 2v10M2 7h10"/></svg>
      Create Offer
    </button>
  </div>

  @if (loading()) {
    <app-skeleton-list [rows]="4" />
  } @else if (offers().length === 0) {
    <app-empty-state
      title="No offers yet"
      message="This outlet has no offers. Use “Create Offer” to add one locked to this outlet."
    />
  } @else {
    <div class="offers-list">
      @for (offer of offers(); track offer.offerId) {
        <app-rich-list-item
          [id]="offer.offerId"
          [name]="offer.offerName"
          [description]="offer.offerCode"
          [category]="discountLabel(offer)"
          [status]="status(offer)"
          [stats]="offerStats(offer)"
          [showEdit]="true"
          [showDelete]="true"
          [accentBar]="true"
          (editClick)="openEdit(offer)"
          (deleteClick)="confirmDelete(offer)"
        />
      }
    </div>
  }
</div>
